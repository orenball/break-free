<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Break Free</title>
<meta name="description" content="Break free from a bad habit: a clean-time timer, daily check-ins, milestones and support.">
<meta name="theme-color" content="#2f8f6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Break Free">
<style>
  /* Calm "recovery green" palette; one column, cards, bottom tab bar */
  :root {
    --bg: #f3f6f4; --panel: #ffffff; --panel-2: #eef3f0; --text: #1d2a25; --muted: #5f7069;
    --border: #dbe4df; --accent: #2f8f6b; --accent-2: #3aa77e; --accent-soft: #dff1e9; --accent-text: #ffffff;
    --warn: #c9463f; --warn-soft: #fbe6e5; --gold: #c98f12; --gold-soft: #fbf0d5;
    --shadow: 0 6px 20px rgba(20, 40, 30, 0.10); --overlay: rgba(10, 20, 15, 0.55);
    --nav-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101613; --panel: #19221e; --panel-2: #212c27; --text: #e6efea; --muted: #94a59d;
      --border: #2d3a34; --accent: #46b98d; --accent-2: #5ccc9f; --accent-soft: #1f3a2f; --accent-text: #0d1a14;
      --warn: #ef6f6a; --warn-soft: #3a2120; --gold: #f0bf4c; --gold-soft: #3a3020;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.4); --overlay: rgba(0, 0, 0, 0.65);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 640px; margin: 0 auto;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  header.top h1 { font-size: 22px; margin: 0; letter-spacing: -0.3px; }
  header.top h1 span { color: var(--accent); }
  .greet { color: var(--muted); font-size: 15px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  h2 { font-size: 21px; margin: 0 0 6px; text-wrap: balance; }
  h3 { font-size: 16px; margin: 0 0 10px; }
  p.sub { color: var(--muted); margin: 0 0 16px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  button, a.btn {
    font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); padding: 11px 16px; min-height: 44px;
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
  }
  button:hover, a.btn:hover { border-color: var(--accent); }
  button:focus-visible, a.btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .primary { background: var(--accent) !important; border-color: var(--accent) !important; color: var(--accent-text) !important; font-weight: 600; }
  .danger { background: var(--warn) !important; border-color: var(--warn) !important; color: #fff !important; font-weight: 600; }
  .ghost { background: transparent; }

  input[type=text], input[type=number], input[type=date], input[type=time], textarea, select {
    font: inherit; width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text);
  }
  textarea { min-height: 90px; resize: vertical; }
  label.field { display: block; margin: 12px 0 6px; font-weight: 600; font-size: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1 1 140px; min-width: 0; }
  .row > select { flex: 0 0 84px; }

  .progress { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .progress > div { height: 100%; background: var(--accent); transition: width 0.3s; }
  .step-label { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .tile { flex-direction: column; gap: 4px; padding: 14px 8px; border-radius: 14px; }
  .tile .emo { font-size: 28px; line-height: 1; }
  .selected { background: var(--accent-soft) !important; border-color: var(--accent) !important; box-shadow: inset 0 0 0 1px var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border-radius: 99px; padding: 9px 14px; min-height: 40px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { justify-content: flex-start; text-align: start; }
  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .error { color: var(--warn); font-size: 14px; margin-top: 10px; min-height: 1em; }
  .note { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: 15px; }
  .note.gold { background: var(--gold-soft); }

  input[type=range] { width: 100%; accent-color: var(--accent); }
  .range-val { font-size: 34px; font-weight: 700; text-align: center; color: var(--accent); }
  .range-text { text-align: center; color: var(--muted); }

  .focus-list { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 8px; }
  .focus-list li { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; display: flex; gap: 8px; }
  .focus-list li::before { content: "💡"; }

  .summary { margin: 0; }
  .summary dt { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .summary dd { margin: 2px 0 0; font-weight: 500; overflow-wrap: anywhere; }

  /* language screen */
  .lang-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .lang-btns button { min-height: 96px; font-size: 20px; flex-direction: column; }
  .lang-btns small { font-size: 13px; color: var(--muted); }

  /* home */
  .why-card { font-size: 18px; font-style: italic; text-align: center; padding: 18px 20px; background: var(--accent-soft); border: none; }
  .eyebrow { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .timer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin: 8px 0 16px; }
  .timer div { background: var(--panel-2); border-radius: 14px; padding: 12px 4px; }
  .timer b { display: block; font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .timer span { font-size: 12px; color: var(--muted); }
  .timer-title { text-align: center; color: var(--muted); font-size: 14px; }
  .quote { font-size: 17px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat { background: var(--panel-2); border-radius: 14px; padding: 12px; min-width: 0; }
  .stat b { font-size: 22px; display: block; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .badge { border: 1px dashed var(--border); border-radius: 14px; padding: 10px; text-align: center; font-size: 13px; color: var(--muted); }
  .badge .emo { font-size: 24px; display: block; filter: grayscale(1); opacity: 0.5; }
  .badge.done { border-style: solid; border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
  .badge.done .emo { filter: none; opacity: 1; }
  .badge.fav { box-shadow: 0 0 0 2px var(--gold); }
  .fav-box { background: var(--gold-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { text-align: center; border-radius: 10px; padding: 6px 2px; background: var(--panel-2); font-size: 12px; }
  .day b { display: block; font-size: 18px; }
  .day.yes { background: var(--accent-soft); }
  .day.no { background: var(--warn-soft); }
  .day.today { outline: 2px solid var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .actions > * { flex: 1 1 150px; }

  /* why page */
  .why-big { font-size: 24px; line-height: 1.35; font-weight: 600; text-align: center; padding: 28px 20px; background: var(--accent-soft); border: none; text-wrap: balance; }
  .why-line { font-size: 18px; text-align: center; background: var(--gold-soft); border: none; }
  .kv { display: grid; gap: 14px; }
  .kv div span { display: block; font-size: 13px; color: var(--muted); }
  .kv div p { margin: 2px 0 0; overflow-wrap: anywhere; }

  /* learn */
  .art-list { display: flex; flex-direction: column; gap: 8px; }
  a.art, .art { justify-content: flex-start; text-align: start; gap: 12px; padding: 12px 14px; }
  .art .emo { font-size: 26px; flex: 0 0 auto; }
  .art b { display: block; }
  .art small { color: var(--muted); display: block; }
  .art small.about { color: var(--text); margin-top: 2px; }
  .art > span:nth-child(2) { flex: 1 1 auto; min-width: 0; }
  .art .ext { color: var(--muted); flex: 0 0 auto; }
  [dir=rtl] .art .ext { transform: scaleX(-1); }
  .article h2 { margin-bottom: 4px; }
  .article h3 { margin-top: 20px; }
  .article p { margin: 0 0 10px; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 18px 0 8px; }

  /* community */
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar { display: grid; grid-template-columns: minmax(90px, 40%) 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
  .bar .track { height: 12px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 99px; }
  .bar b { font-variant-numeric: tabular-nums; }

  /* tab bar */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--panel); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  .tabbar-inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
  .tab { background: none; border: none; border-radius: 0; min-height: var(--nav-h); flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); padding: 6px 2px; }
  .tab .ico { font-size: 22px; line-height: 1; }
  .tab.active { color: var(--accent); font-weight: 700; }

  /* modal + toast */
  .overlay { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .overlay.show { display: flex; }
  .modal { background: var(--panel); border-radius: 20px; padding: 22px; max-width: 460px; width: 100%; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
  .modal .big { font-size: 44px; text-align: center; }
  .modal h2, .modal p.c { text-align: center; }
  .modal .actions { margin-top: 16px; }
  .linkbox { font-size: 13px; background: var(--panel-2); border-radius: 10px; padding: 10px; overflow-wrap: anywhere; direction: ltr; text-align: left; user-select: all; }
  .banner { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .banner span { flex: 1 1 200px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(200px); background: var(--text); color: var(--bg);
    padding: 12px 18px; border-radius: 12px; transition: transform 0.3s; z-index: 60; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 70; pointer-events: none; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: 0.7; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } .toast, .progress > div { transition: none; } }
  .hidden { display: none !important; }
  @media (max-width: 420px) { .timer b { font-size: 26px; } .card { padding: 16px; } .why-big { font-size: 21px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Break <span>Free</span></h1>
    <div class="greet" id="greet"></div>
  </header>

  <!-- LANGUAGE -->
  <section id="langScreen" class="hidden">
    <div class="card">
      <h2>Choose your language · בחרו שפה</h2>
      <p class="sub">You can change it later · אפשר לשנות אחר כך</p>
      <div class="lang-btns">
        <button id="langEn" data-lang="en">English<small>Left to right</small></button>
        <button id="langHe" data-lang="he">עברית<small>מימין לשמאל</small></button>
      </div>
    </div>
  </section>

  <!-- SETUP -->
  <section id="setup" class="hidden">
    <div class="card">
      <div class="progress"><div id="progBar"></div></div>
      <div class="step-label" id="stepLabel"></div>
      <div id="stepBody"></div>
      <div class="error" id="stepError" role="alert"></div>
      <div class="nav">
        <button id="backBtn"></button>
        <button id="nextBtn" class="primary"></button>
      </div>
    </div>
  </section>

  <!-- APP PAGES -->
  <section id="app" class="hidden">
    <div id="pHome" class="page"></div>
    <div id="pWhy" class="page hidden"></div>
    <div id="pLearn" class="page hidden"></div>
    <div id="pComm" class="page hidden"></div>
    <div id="pProfile" class="page hidden"></div>
  </section>

  <!-- PUBLIC SHARE PAGE -->
  <section id="shareView" class="hidden"></section>
</div>

<nav class="tabbar hidden" id="tabbar">
  <div class="tabbar-inner">
    <button class="tab" data-tab="pHome"><span class="ico">🏠</span><span data-t="tabHome"></span></button>
    <button class="tab" data-tab="pWhy"><span class="ico">💚</span><span data-t="tabWhy"></span></button>
    <button class="tab" data-tab="pLearn"><span class="ico">📖</span><span data-t="tabLearn"></span></button>
    <button class="tab" data-tab="pComm"><span class="ico">👥</span><span data-t="tabCommunity"></span></button>
    <button class="tab" data-tab="pProfile"><span class="ico">👤</span><span data-t="tabProfile"></span></button>
  </div>
</nav>

<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="i18n.js"></script>
<script src="articles.js" onerror="window.BF_ARTICLES = window.BF_ARTICLES || []"></script>
<script src="firebase-config.js"></script>
<script>
(function () {
  "use strict";

  /* ================= constants ================= */
  var KEY = "breakFree.app.v1";
  var FB_VER = "10.12.2";
  var EMO = {
    alcohol: "🍺", cigarettes: "🚬", weed: "🌿", drugs: "💉", pills: "💊", junkfood: "🍔", sweets: "🍬",
    energy: "⚡", coffee: "☕", porn: "🔞", nailbiting: "😬", betting: "🎰", tiktok: "🎵", reels: "📱", other: "✨"
  };
  var HABIT_META = {
    alcohol: { per: "week", costly: true }, cigarettes: { per: "day", costly: true }, weed: { per: "day", costly: true },
    drugs: { per: "week", costly: true }, pills: { per: "day", costly: true }, junkfood: { per: "week", costly: true },
    sweets: { per: "day", costly: true }, energy: { per: "day", costly: true }, coffee: { per: "day", costly: true },
    porn: { per: "day" }, nailbiting: { choice: true }, betting: { per: "week", money: true },
    tiktok: { per: "day" }, reels: { per: "day" }, other: { per: "day", costly: true }
  };
  var HABIT_ORDER = Object.keys(EMO);
  var GOAL_IDS = ["happiness", "discipline", "health", "money", "sleep", "time", "relationships", "confidence", "focus"];
  var BELIEF_IDS = ["yes", "think", "unsure", "scared"];
  var SHARE_IDS = ["person", "community", "self"];
  var MILESTONES = [
    { id: "24h", emo: "🌱", ms: 864e5 }, { id: "morning", emo: "🌅" }, { id: "sayno", emo: "🙅" },
    { id: "3d", emo: "🔥", ms: 3 * 864e5 }, { id: "1w", emo: "⭐", ms: 7 * 864e5 }, { id: "2w", emo: "🌟", ms: 14 * 864e5 },
    { id: "1m", emo: "🏅", ms: 30 * 864e5 }, { id: "3m", emo: "🏆", ms: 90 * 864e5 }, { id: "1y", emo: "👑", ms: 365 * 864e5 }
  ];
  var FAV_CHOICES = ["24h", "morning", "sayno", "1w", "1m", "3m", "1y"];
  var CURRENCIES = ["₪", "$", "€", "£"];

  /* ================= state ================= */
  function blankState() {
    return {
      lang: null, setupDone: false,
      name: "", age: "", about: "",
      habit: null, habitOther: "",
      startDate: todayStr(), startTime: nowTimeStr(),
      amount: "", amount2: "", freqChoice: "", cost: "", currency: "₪",
      goals: [], goalOther: "", improve: "", critical: 7, belief: null,
      share: null, shareName: "", milestone: null, milestoneOther: "",
      why: "", reminderTime: "20:00",
      streakStart: null, bestMs: 0, restarts: 0,
      checkins: {}, saidNo: null, lastPrompt: null,
      shareId: null, notify: false, fcmToken: null
    };
  }
  var S = load();
  var step = 0, whyWarned = false, currentTab = "pHome", openArticle = null;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var s = JSON.parse(raw), b = blankState(); for (var k in b) if (!(k in s)) s[k] = b[k]; return s; }
    } catch (e) {}
    return blankState();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    scheduleSync();
  }

  /* ================= helpers ================= */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function L() { return window.BF_I18N[S.lang || "en"]; }
  function t(key, vars) {
    var s = L().ui[key];
    if (s == null) s = window.BF_I18N.en.ui[key] || key;
    if (vars) for (var k in vars) s = s.split("{" + k + "}").join(vars[k]);
    return s;
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayStr() { return dateKey(new Date()); }
  function nowTimeStr() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function hab(key) { return L().habits[key || S.habit] || L().habits.other; }
  function habitLabel(key, other) {
    key = key || S.habit;
    if (key === "other") return other != null ? other : (S.habitOther || hab("other").label);
    return hab(key).label;
  }
  function habitName() {
    if (S.habit === "other") return S.habitOther || hab("other").label;
    var h = hab();
    return S.lang === "he" ? (h.short || h.label) : (h.short || h.label).toLowerCase();
  }
  function goalLabels() {
    var list = S.goals.map(function (id) { var g = L().goals[id]; return g ? (S.lang === "he" ? g.label : g.label.toLowerCase()) : id; });
    if (S.goalOther.trim()) list.push(S.goalOther.trim());
    return list;
  }
  function joinNice(list) {
    if (list.length <= 1) return list.join("");
    var and = L().plural.and;
    return list.slice(0, -1).join(", ") + and + list[list.length - 1];
  }
  function milestoneLabel(id) {
    if (id === "custom") return S.milestoneOther;
    return L().milestones[id] || "";
  }
  function streakMs() { return S.streakStart ? Date.now() - S.streakStart : 0; }
  function fmtNum(n) { return n >= 100 ? Math.round(n).toLocaleString(L().locale) : (Math.round(n * 10) / 10).toLocaleString(L().locale); }
  function heldText(ms) {
    var d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, P = L().plural;
    if (d > 0) return P.day(d) + (h ? P.and + P.hour(h) : "");
    return P.hour(h);
  }
  function randomId(n) {
    var a = "abcdefghijkmnpqrstuvwxyz23456789", s = "", r = new Uint32Array(n);
    (window.crypto || window.msCrypto).getRandomValues(r);
    for (var i = 0; i < n; i++) s += a[r[i] % a.length];
    return s;
  }
  var toastTimer;
  function toast(msg) {
    var el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3000);
  }
  function confetti() {
    var colors = ["#2f8f6b", "#e0a526", "#5ccc9f", "#e46a8b", "#4f8fdc"];
    for (var i = 0; i < 60; i++) {
      var c = document.createElement("div");
      c.className = "confetti"; c.style.left = Math.random() * 100 + "vw"; c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.8 + Math.random() * 1.8) + "s"; c.style.animationDelay = (Math.random() * 0.4) + "s";
      document.body.appendChild(c);
      setTimeout(function (el) { el.remove(); }, 4200, c);
    }
  }
  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {} ta.remove(); done();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  function focusPrompts() {
    var list = [];
    var goals = goalLabels();
    if (goals.length) list.push(t("fGoal", { goals: joinNice(goals) }));
    if (S.improve.trim()) list.push(t("fImprove", { improve: S.improve.trim() }));
    list.push(t("fFor", { who: S.share === "person" && S.shareName.trim() ? S.shareName.trim() : t("fWhoDefault") }));
    if (S.milestone) list.push(t("fMs", { ms: milestoneLabel(S.milestone) }));
    list.push(t("fCrit", { crit: S.critical }));
    list.push(t("fHardDay"));
    return list;
  }
  function mentionsGoal(text) {
    var tx = text.toLowerCase();
    var ok = S.goals.some(function (id) {
      return ["en", "he"].some(function (l) { return window.BF_I18N[l].goals[id].words.some(function (w) { return tx.indexOf(w) >= 0; }); });
    });
    if (!ok && S.goalOther.trim()) { var first = S.goalOther.trim().toLowerCase().split(/\s+/)[0]; ok = first.length > 2 && tx.indexOf(first) >= 0; }
    return ok;
  }
  function validateWhy(text) {
    var w = text.trim();
    if (w.length < 10) return t("errWhyShort");
    var sentences = w.split(/[.!?]+/).filter(function (x) { return x.trim().length > 2; }).length;
    if (sentences > 2 && !whyWarned) { whyWarned = true; return t("errWhyLong"); }
    if (!mentionsGoal(w) && !whyWarned) { whyWarned = true; return t("errWhyGoal", { goals: joinNice(goalLabels()) }); }
  }
  function updateWhyCount() {
    var el = $("whyCount"); if (!el) return;
    var w = S.why.trim();
    el.textContent = t("chars", { n: w.length }) + (w ? " · " + (mentionsGoal(w) ? t("hasGoal") : t("addGoal")) : "");
  }
  function startTs() {
    var p = S.startDate.split("-").map(Number), q = (S.startTime || "00:00").split(":").map(Number);
    return new Date(p[0], p[1] - 1, p[2], q[0], q[1]).getTime();
  }
  function usageText() {
    var h = hab(), m = HABIT_META[S.habit] || {}, per = L().per;
    if (m.choice) return h.choice[+S.freqChoice] || "";
    if (m.money) return S.currency + S.amount + " " + per.week + ", " + S.amount2 + " " + h.unit + " " + per.week;
    var s = S.amount + " " + h.unit + " " + per[m.per];
    if (S.cost) s += " (" + S.currency + S.cost + " " + per.week + ")";
    return s;
  }

  function renderStep() {
    var s = STEPS[step];
    $("stepBody").innerHTML = s.render(); s.bind();
    $("stepError").textContent = "";
    $("progBar").style.width = ((step + 1) / STEPS.length * 100) + "%";
    $("stepLabel").textContent = t("stepOf", { n: step + 1, total: STEPS.length });
    $("backBtn").textContent = t("back");
    $("backBtn").style.visibility = "visible";
    $("nextBtn").textContent = step === STEPS.length - 1 ? t("startJourney") : t("next");
  }
  $("nextBtn").addEventListener("click", function () {
    var err = STEPS[step].validate();
    if (err) { $("stepError").textContent = err; return; }
    if (step < STEPS.length - 1) { step++; whyWarned = false; save(); renderStep(); window.scrollTo(0, 0); return; }
    S.setupDone = true; S.streakStart = startTs();
    if (reminderTsFor(new Date()) <= Date.now()) S.lastPrompt = todayStr();
    save(); route(); confetti(); toast(t("toastStart"));
    setTimeout(function () { offerReminders(); }, 1200);
  });
  $("backBtn").addEventListener("click", function () {
    if (step > 0) { step--; whyWarned = false; renderStep(); }
    else { S.lang = null; save(); route(); }
  });

  /* ================= routing ================= */
  function route() {
    applyLang();
    var hash = location.hash || "";
    var shareMatch = hash.match(/^#share-([a-z0-9]{6,20})$/);
    ["langScreen", "setup", "app", "shareView"].forEach(function (id) { $(id).classList.add("hidden"); });
    $("tabbar").classList.add("hidden");
    $("greet").textContent = "";
    if (shareMatch) { if (!S.lang) S.lang = (navigator.language || "").indexOf("he") === 0 ? "he" : "en"; applyLang(); showShareView(shareMatch[1]); return; }
    if (!S.lang) { $("langScreen").classList.remove("hidden"); return; }
    if (!S.setupDone) { $("setup").classList.remove("hidden"); renderStep(); return; }
    $("app").classList.remove("hidden"); $("tabbar").classList.remove("hidden");
    showTab(currentTab);
    if (hash === "#checkin") { history.replaceState(null, "", location.pathname + location.search); showTab("pHome"); openCheckin(); }
  }
  window.addEventListener("hashchange", route);

  function showTab(id) {
    currentTab = id;
    document.querySelectorAll(".page").forEach(function (p) { p.classList.toggle("hidden", p.id !== id); });
    document.querySelectorAll(".tab").forEach(function (b) {
      var on = b.dataset.tab === id; b.classList.toggle("active", on);
      if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    $("greet").textContent = greeting();
    ({ pHome: renderHome, pWhy: renderWhy, pLearn: renderLearn, pComm: renderComm, pProfile: renderProfile })[id]();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tab").forEach(function (b) { b.addEventListener("click", function () { openArticle = null; showTab(b.dataset.tab); }); });

  function greeting() {
    var h = new Date().getHours(), name = S.name.trim();
    if (!name) return "";
    var k = h < 5 ? "greetNight" : h < 12 ? "greetMorning" : h < 17 ? "greetAfternoon" : h < 22 ? "greetEvening" : "greetNight";
    return t(k, { name: name });
  }

  function offerReminders() {
    var ns = notifState();
    if (ns !== "off" && ns !== "ios") return;
    openModal("<div class='big'>🔔</div><h2>" + t("notifTitle") + "</h2><p class='c'>" + t("remSub") + "</p>" +
      (ns === "ios" ? "<div class='note gold'><b>" + t("iosGuideTitle") + "</b><br>" + t("iosGuide") + "</div><div class='actions'><button class='primary' id='okBtn'>" + t("thanks") + "</button></div>"
        : "<div class='actions'><button id='laterBtn'>" + t("ciLater") + "</button><button class='primary' id='onBtn'>" + t("notifOff") + "</button></div>"));
    if ($("okBtn")) $("okBtn").addEventListener("click", closeModal);
    if ($("laterBtn")) $("laterBtn").addEventListener("click", closeModal);
    if ($("onBtn")) $("onBtn").addEventListener("click", function () { closeModal(); enablePush(); });
  }

  /* ================= Firebase (optional) ================= */
  var FB = { configured: !!self.BF_FIREBASE_CONFIG, ready: false, uid: null, db: null, messaging: null };
  function loadScript(src) {
    return new Promise(function (res, rej) { var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }
  function initFirebase() {
    if (!FB.configured) return;
    var base = "https://www.gstatic.com/firebasejs/" + FB_VER + "/";
    loadScript(base + "firebase-app-compat.js")
      .then(function () { return Promise.all(["auth", "firestore", "messaging"].map(function (m) { return loadScript(base + "firebase-" + m + "-compat.js"); })); })
      .then(function () {
        firebase.initializeApp(self.BF_FIREBASE_CONFIG);
        FB.db = firebase.firestore();
        try { if (firebase.messaging.isSupported()) FB.messaging = firebase.messaging(); } catch (e) {}
        if (FB.messaging) FB.messaging.onMessage(function () { checkReminderForce(); });
        firebase.auth().onAuthStateChanged(function (u) {
          if (!u) return;
          FB.uid = u.uid; FB.ready = true;
          syncNow();
          if (currentTab === "pComm" && !$("app").classList.contains("hidden")) renderComm();
          if (currentTab === "pProfile" && !$("app").classList.contains("hidden")) renderProfile();
          if (pendingShareView) { var id = pendingShareView; pendingShareView = null; showShareView(id); }
        });
        return firebase.auth().signInAnonymously();
      })
      .catch(function () { FB.ready = false; });
  }
  function checkReminderForce() {
    if (!S.setupDone || S.checkins[todayStr()]) return;
    showTab("pHome"); openCheckin();
  }
  var syncTimer = null;
  function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1200); }
  function lastCheckinDate() { var k = Object.keys(S.checkins).sort(); return k.length ? k[k.length - 1] : null; }
  function syncNow() {
    if (!FB.ready || !S.setupDone) return Promise.resolve();
    var tz = "UTC"; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch (e) {}
    var jobs = [FB.db.collection("users").doc(FB.uid).set({
      lang: S.lang, habit: S.habit, reminderTime: S.reminderTime, tz: tz,
      notify: !!S.notify, fcmToken: S.fcmToken || null,
      streakStart: S.streakStart, bestMs: S.bestMs, restarts: S.restarts, checkinsYes: checkinsYes(),
      lastCheckinDate: lastCheckinDate(), updatedAt: Date.now()
    }, { merge: true })];
    if (S.shareId) jobs.push(FB.db.collection("shares").doc(S.shareId).set({
      owner: FB.uid, name: S.name.trim().split(/\s+/)[0] || "", habit: S.habit, habitOther: S.habit === "other" ? S.habitOther : "",
      streakStart: S.streakStart, bestMs: S.bestMs, restarts: S.restarts, checkinsYes: checkinsYes(),
      saidNo: !!S.saidNo, updatedAt: Date.now()
    }));
    return Promise.all(jobs).catch(function () {});
  }
  function enablePush() {
    var ns = notifState();
    if (ns === "ios") { offerReminders(); return; }
    if (ns === "unsupported") { toast(t("notifUnsupported")); return; }
    if (ns === "offline" || !FB.ready || !FB.messaging) { toast(t("notifOffline")); return; }
    Notification.requestPermission().then(function (perm) {
      if (perm !== "granted") { toast(t("notifDenied")); renderProfileIfOpen(); return; }
      return navigator.serviceWorker.register("firebase-messaging-sw.js").then(function (reg) {
        return FB.messaging.getToken({ vapidKey: self.BF_VAPID_KEY, serviceWorkerRegistration: reg });
      }).then(function (token) {
        if (!token) throw new Error("no token");
        S.notify = true; S.fcmToken = token; save(); syncNow(); toast(t("notifEnabled")); renderProfileIfOpen();
      });
    }).catch(function () { toast(t("notifError")); });
  }
  function disablePush() {
    S.notify = false;
    var p = FB.messaging ? FB.messaging.deleteToken().catch(function () {}) : Promise.resolve();
    p.then(function () { S.fcmToken = null; save(); syncNow(); toast(t("notifDisabled")); renderProfileIfOpen(); });
  }
  function renderProfileIfOpen() { if (currentTab === "pProfile" && !$("app").classList.contains("hidden")) renderProfile(); }

  /* ================= share ================= */
  function shareUrl() { return location.origin + location.pathname + "#share-" + S.shareId; }
  function shareProgress() {
    if (!FB.ready) { toast(t("shareOffline")); return; }
    if (!S.shareId) { S.shareId = randomId(10); save(); }
    syncNow().then(function () {
      var url = shareUrl(), text = t("shareText", { habit: habitName() });
      var wa = "https://wa.me/?text=" + encodeURIComponent(text + " " + url);
      openModal("<div class='big'>🔗</div><h2>" + t("shareCardTitle") + "</h2><p class='c small muted'>" + t("shareCardSub") + "</p>" +
        "<div class='linkbox' id='shareLink'>" + esc(url) + "</div>" +
        "<div class='actions'>" + (navigator.share ? "<button class='primary' id='nativeShare'>" + t("shareBtn") + "</button>" : "") +
        "<a class='btn' href='" + esc(wa) + "' target='_blank' rel='noopener'>" + t("shareWa") + "</a><button id='copyLink'>" + t("shareCopy") + "</button></div>" +
        "<p class='small muted'>" + t("shareInstaHint") + "</p><div class='actions'><button class='ghost' id='shareClose'>" + t("cancel") + "</button></div>");
      if ($("nativeShare")) $("nativeShare").addEventListener("click", function () { navigator.share({ title: "Break Free", text: text, url: url }).catch(function () {}); });
      $("copyLink").addEventListener("click", function () { copyText(url, function () { toast(t("linkCopied")); }); });
      $("shareClose").addEventListener("click", closeModal);
    });
  }
  var pendingShareView = null, shareUnsub = null, shareTimer = null;
  function showShareView(id) {
    var v = $("shareView"); v.classList.remove("hidden");
    if (!FB.configured) { v.innerHTML = "<div class='card'>" + t("shareOffline") + "</div>"; return; }
    if (!FB.ready) { pendingShareView = id; v.innerHTML = "<div class='card muted'>" + t("svLoading") + "</div>"; return; }
    if (shareUnsub) shareUnsub();
    shareUnsub = FB.db.collection("shares").doc(id).onSnapshot(function (snap) {
      if (!snap.exists) { v.innerHTML = "<div class='card'>" + t("svNotFound") + "</div>" + ctaHtml(); bindCta(); return; }
      drawShareView(snap.data());
    }, function () { v.innerHTML = "<div class='card'>" + t("svNotFound") + "</div>" + ctaHtml(); bindCta(); });
  }
  function ctaHtml() { return "<div class='actions'><button class='primary' id='svCta'>" + t("svCta") + "</button></div>"; }
  function bindCta() { $("svCta").addEventListener("click", function () { history.replaceState(null, "", location.pathname); route(); }); }
  function drawShareView(d) {
    var label = d.habit === "other" ? (d.habitOther || L().habits.other.label) : (L().habits[d.habit] || L().habits.other).label;
    var reached = MILESTONES.filter(function (m) { return milestoneDone(m, d.streakStart, d.saidNo); });
    $("shareView").innerHTML =
      "<div class='card why-big'><span class='eyebrow'>" + t("svSub") + "</span>" + (EMO[d.habit] || "✨") + " " + esc(d.name ? t("svTitle", { name: d.name, habit: label }) : t("svTitleNoName", { habit: label })) + "</div>" +
      "<div class='card'><div class='timer'>" +
        "<div><b id='svD'>0</b><span>" + t("days") + "</span></div><div><b id='svH'>0</b><span>" + t("hours") + "</span></div>" +
        "<div><b id='svM'>0</b><span>" + t("min") + "</span></div><div><b id='svS'>0</b><span>" + t("sec") + "</span></div></div>" +
        "<div class='stats'>" + stat(t("dh", { d: Math.floor(Math.max(d.bestMs || 0, Date.now() - d.streakStart) / 864e5), h: Math.floor(Math.max(d.bestMs || 0, Date.now() - d.streakStart) / 36e5) % 24 }), t("svBest")) +
        stat(d.checkinsYes || 0, t("svCheckins")) + "</div></div>" +
      "<div class='card'><h3>" + t("svMs") + "</h3>" + (reached.length ? "<div class='badges'>" + reached.map(function (m) {
        return "<div class='badge done'><span class='emo'>" + m.emo + "</span>" + esc(L().milestones[m.id]) + "</div>"; }).join("") + "</div>" : "<p class='muted'>" + t("svNone") + "</p>") + "</div>" + ctaHtml();
    bindCta();
    clearInterval(shareTimer);
    function upd() {
      if (!$("svD")) { clearInterval(shareTimer); return; }
      var a = Math.max(0, Date.now() - d.streakStart);
      $("svD").textContent = Math.floor(a / 864e5); $("svH").textContent = Math.floor(a / 36e5) % 24;
      $("svM").textContent = Math.floor(a / 6e4) % 60; $("svS").textContent = Math.floor(a / 1e3) % 60;
    }
    upd(); shareTimer = setInterval(upd, 1000);
  }
  window.BF_demoShare = drawShareView; /* for testing */

  /* ================= loop + start ================= */
  setInterval(function () {
    if (!S.setupDone || $("app").classList.contains("hidden")) return;
    if (currentTab === "pHome") {
      tick();
      var now = new Date();
      if (now.getSeconds() === 0) { renderStats(); renderBadges(); }
    }
    if (new Date().getSeconds() % 15 === 0) checkReminder();
  }, 1000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && S.setupDone && !$("app").classList.contains("hidden")) { showTab(currentTab); scheduleSync(); }
  });
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("firebase-messaging-sw.js").catch(function () {});
  initFirebase();
  route();
})();
</script>
</body>
</html>
