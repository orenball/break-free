<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Break Free</title>
<meta name="description" content="Break free from a bad habit: a clean-time timer, daily check-ins, milestones and support.">
<meta name="theme-color" content="#0f9d6b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Break Free">
<style>
  /* Fresh "recovery green": mint-to-teal gradient for the why card and main action, rounded Rubik type */
  :root {
    --bg: #f1f7f3; --panel: #ffffff; --panel-2: #edf4f0; --text: #15241e; --muted: #5a6d65;
    --border: #d6e3dc; --accent: #0f9d6b; --accent-2: #13b37c; --accent-soft: #d9f3e7; --accent-text: #ffffff;
    --grad: linear-gradient(135deg, #0f9d6b 0%, #14b8a6 100%); --grad-text: #ffffff; --glow: rgba(15, 157, 107, 0.32);
    --warn: #c9463f; --warn-soft: #fbe6e5; --gold: #c98f12; --gold-soft: #fbf0d5;
    --shadow: 0 6px 20px rgba(20, 40, 30, 0.10); --overlay: rgba(10, 20, 15, 0.55);
    --nav-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101613; --panel: #19221e; --panel-2: #212c27; --text: #e6efea; --muted: #94a59d;
      --border: #2a3832; --accent: #34d399; --accent-2: #6ee7b7; --accent-soft: #163a2c; --accent-text: #0b1a13;
      --grad: linear-gradient(135deg, #059669 0%, #0d9488 100%); --grad-text: #ffffff; --glow: rgba(52, 211, 153, 0.28);
      --warn: #ef6f6a; --warn-soft: #3a2120; --gold: #f0bf4c; --gold-soft: #3a3020;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.4); --overlay: rgba(0, 0, 0, 0.65);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 640px; margin: 0 auto;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  header.top h1 { font-size: 22px; margin: 0; letter-spacing: -0.3px; }
  header.top h1 span { color: var(--accent); }
  .greet { color: var(--muted); font-size: 15px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  h2 { font-size: 21px; margin: 0 0 6px; text-wrap: balance; }
  h3 { font-size: 16px; margin: 0 0 10px; }
  p.sub { color: var(--muted); margin: 0 0 16px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  button, a.btn {
    font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); padding: 11px 16px; min-height: 44px;
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
  }
  button:hover, a.btn:hover { border-color: var(--accent); }
  button:focus-visible, a.btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .primary { background: var(--accent) !important; border-color: var(--accent) !important; color: var(--accent-text) !important; font-weight: 600; }
  .danger { background: var(--warn) !important; border-color: var(--warn) !important; color: #fff !important; font-weight: 600; }
  .ghost { background: transparent; }

  input[type=text], input[type=number], input[type=date], input[type=time], textarea, select {
    font: inherit; width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text);
  }
  textarea { min-height: 90px; resize: vertical; }
  label.field { display: block; margin: 12px 0 6px; font-weight: 600; font-size: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1 1 140px; min-width: 0; }
  .row > select { flex: 0 0 84px; }

  .progress { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .progress > div { height: 100%; background: var(--accent); transition: width 0.3s; }
  .step-label { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .tile { flex-direction: column; gap: 4px; padding: 14px 8px; border-radius: 14px; }
  .tile .emo { font-size: 28px; line-height: 1; }
  .selected { background: var(--accent-soft) !important; border-color: var(--accent) !important; box-shadow: inset 0 0 0 1px var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border-radius: 99px; padding: 9px 14px; min-height: 40px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { justify-content: flex-start; text-align: start; }
  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .error { color: var(--warn); font-size: 14px; margin-top: 10px; min-height: 1em; }
  .note { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: 15px; }
  .note.gold { background: var(--gold-soft); }

  input[type=range] { width: 100%; accent-color: var(--accent); }
  .range-val { font-size: 34px; font-weight: 700; text-align: center; color: var(--accent); }
  .range-text { text-align: center; color: var(--muted); }

  .focus-list { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 8px; }
  .focus-list li { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; display: flex; gap: 8px; }
  .focus-list li::before { content: "💡"; }

  .summary { margin: 0; }
  .summary dt { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .summary dd { margin: 2px 0 0; font-weight: 500; overflow-wrap: anywhere; }

  /* language screen */
  .lang-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .lang-btns button { min-height: 96px; font-size: 20px; flex-direction: column; }
  .lang-btns small { font-size: 13px; color: var(--muted); }
  .gender-btns button { min-height: 72px; }

  /* home */
  .why-card { font-size: 18px; font-style: italic; text-align: center; padding: 18px 20px; background: var(--accent-soft); border: none; }
  .eyebrow { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .timer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin: 8px 0 16px; }
  .timer div { background: var(--panel-2); border-radius: 14px; padding: 12px 4px; }
  .timer b { display: block; font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .timer span { font-size: 12px; color: var(--muted); }
  .timer-title { text-align: center; color: var(--muted); font-size: 14px; }
  .quote { font-size: 17px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat { background: var(--panel-2); border-radius: 14px; padding: 12px; min-width: 0; }
  .stat b { font-size: 22px; display: block; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .badge { border: 1px dashed var(--border); border-radius: 14px; padding: 10px; text-align: center; font-size: 13px; color: var(--muted); }
  .badge .emo { font-size: 24px; display: block; filter: grayscale(1); opacity: 0.5; }
  .badge.done { border-style: solid; border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
  .badge.done .emo { filter: none; opacity: 1; }
  .badge.fav { box-shadow: 0 0 0 2px var(--gold); }
  .hc-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .hc-head .emo { font-size: 24px; line-height: 1; }
  .hc-head h3 { margin: 0; }
  .fav-line { color: var(--muted); text-align: center; font-size: 13px; margin: -6px 0 12px; min-height: 1em; }
  .slider { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .slider::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: center; margin-bottom: 0; }
  .dots { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 10px 0 4px; }
  .dot { width: 8px; height: 8px; min-height: 0; padding: 0; border: none; border-radius: 99px; background: var(--border); transition: width 0.2s; }
  .dot.on { background: var(--accent); width: 22px; }
  .swipe-hint { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .single-gap { height: 16px; }
  .ms-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 12px; }
  .ms-strip .m { font-size: 20px; filter: grayscale(1); opacity: 0.35; }
  .ms-strip .m.done { filter: none; opacity: 1; }
  .ms-strip small { color: var(--muted); margin-inline-start: auto; }
  .chart { margin-top: 12px; direction: ltr; }
  .chart-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 4px; min-height: 18px; }
  [dir=rtl] .chart-head { flex-direction: row-reverse; }
  .chart-tip { color: var(--text); font-variant-numeric: tabular-nums; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .grid { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 3; }
  .chart .base { stroke: var(--border); stroke-width: 1; }
  .chart .ax { fill: var(--muted); font-size: 9px; font-family: inherit; }
  .chart .area { fill: var(--accent-soft); }
  .chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .enddot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
  .chart .slipdot { fill: var(--warn); stroke: var(--panel); stroke-width: 2; }
  .chart .cross { stroke: var(--muted); stroke-width: 1; }
  .chart .hit { fill: transparent; cursor: crosshair; }
  .moods { display: flex; justify-content: center; gap: 6px; margin: 6px 0 2px; }
  .moods button { font-size: 26px; min-height: 48px; padding: 6px 8px; background: transparent; border-color: transparent; }
  .moods button.selected { transform: scale(1.15); }
  .day small { display: block; font-size: 13px; line-height: 1; min-height: 13px; }
  .journal { display: flex; flex-direction: column; gap: 10px; }
  .jrow { display: flex; gap: 10px; align-items: flex-start; }
  .jrow .jm { font-size: 22px; line-height: 1.2; }
  .jrow small { display: block; color: var(--muted); }
  .jrow p { margin: 0; overflow-wrap: anywhere; }
  .habit-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .habit-row:last-child { border-bottom: none; }
  .rem-row { flex-wrap: nowrap; margin-bottom: 8px; align-items: center; }
  .rem-row input { flex: 1 1 auto; }
  .rem-row button { flex: 0 0 auto; }
  .habit-row small { color: var(--muted); display: block; }
  .habit-row { flex-wrap: wrap; }
  .hr-info { flex: 1 1 150px; min-width: 0; }
  .hr-info b { font-weight: 500; }
  .row-btns { display: flex; gap: 4px; flex: 0 0 auto; }
  .row-btns button { padding: 8px 10px; min-height: 40px; }
  .fav-box { background: var(--gold-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { text-align: center; border-radius: 10px; padding: 6px 2px; background: var(--panel-2); font-size: 12px; }
  .day b { display: block; font-size: 18px; }
  .day.yes { background: var(--accent-soft); }
  .day.no { background: var(--warn-soft); }
  .day.today { outline: 2px solid var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .actions > * { flex: 1 1 150px; }

  /* why page */
  .why-big { font-size: 24px; line-height: 1.35; font-weight: 600; text-align: center; padding: 28px 20px; background: var(--accent-soft); border: none; text-wrap: balance; }
  .why-line { font-size: 18px; text-align: center; background: var(--gold-soft); border: none; }
  .kv { display: grid; gap: 14px; }
  .kv div span { display: block; font-size: 13px; color: var(--muted); }
  .kv div p { margin: 2px 0 0; overflow-wrap: anywhere; }

  /* learn */
  .art-list { display: flex; flex-direction: column; gap: 8px; }
  a.art, .art { justify-content: flex-start; text-align: start; gap: 12px; padding: 12px 14px; }
  .art .emo { font-size: 26px; flex: 0 0 auto; }
  .art b { display: block; }
  .art small { color: var(--muted); display: block; }
  .art small.about { color: var(--text); margin-top: 2px; }
  .art > span:nth-child(2) { flex: 1 1 auto; min-width: 0; }
  .art .ext { color: var(--muted); flex: 0 0 auto; }
  [dir=rtl] .art .ext { transform: scaleX(-1); }
  .article h2 { margin-bottom: 4px; }
  .article h3 { margin-top: 20px; }
  .article p { margin: 0 0 10px; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 18px 0 8px; }

  /* community */
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar { display: grid; grid-template-columns: minmax(90px, 40%) 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
  .bar .track { height: 12px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 99px; }
  .bar b { font-variant-numeric: tabular-nums; }

  /* tab bar */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--panel); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  .tabbar-inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
  .tab { background: none; border: none; border-radius: 0; min-height: var(--nav-h); flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); padding: 6px 2px; }
  .tab .ico { font-size: 22px; line-height: 1; }
  .tab.active { color: var(--accent); font-weight: 700; }

  /* modal + toast */
  .overlay { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .overlay.show { display: flex; }
  .modal { background: var(--panel); border-radius: 20px; padding: 22px; max-width: 460px; width: 100%; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
  .modal .big { font-size: 44px; text-align: center; }
  .modal h2, .modal p.c { text-align: center; }
  .modal .actions { margin-top: 16px; }
  .linkbox { font-size: 13px; background: var(--panel-2); border-radius: 10px; padding: 10px; overflow-wrap: anywhere; direction: ltr; text-align: left; user-select: all; }
  .banner { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .banner span { flex: 1 1 200px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(200px); background: var(--text); color: var(--bg);
    padding: 12px 18px; border-radius: 12px; transition: transform 0.3s; z-index: 60; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 70; pointer-events: none; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: 0.7; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } .toast, .progress > div { transition: none; } }
  /* ---------- livelier look ---------- */
  header.top h1 { font-size: 24px; font-weight: 800; }
  h2, h3 { font-weight: 700; }
  .card { border-radius: 22px; border-color: transparent; box-shadow: 0 8px 24px rgba(15, 60, 40, 0.08); }
  .why-card, .why-big { background: var(--grad); color: var(--grad-text); font-style: normal; font-weight: 500; box-shadow: 0 10px 28px var(--glow); }
  .why-card .eyebrow, .why-big .eyebrow { color: rgba(255, 255, 255, 0.85); }
  .primary { background: var(--grad) !important; border-color: transparent !important; color: var(--grad-text) !important; font-weight: 700; }
  #checkinNowBtn { min-height: 56px; font-size: 17px; border-radius: 18px; box-shadow: 0 8px 20px var(--glow); }
  #checkinNowBtn.pulse { animation: glow 2.6s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { box-shadow: 0 8px 18px var(--glow); } 50% { box-shadow: 0 8px 34px var(--glow), 0 0 0 4px var(--accent-soft); } }
  .timer div { background: var(--accent-soft); border-radius: 16px; }
  .timer b { color: var(--accent); font-weight: 800; font-size: 36px; }
  .hc-head h3 { font-size: 19px; }
  .stat { border-radius: 16px; }
  .stat b { font-weight: 700; }
  button, a.btn { border-radius: 14px; transition: transform 0.12s ease, box-shadow 0.2s ease, background-color 0.2s ease; }
  button:active:not(:disabled), a.btn:active { transform: scale(0.97); }
  .lang-btns button { font-size: 22px; font-weight: 700; }
  .tab { isolation: isolate; position: relative; }
  .tab .ico { transition: transform 0.2s ease; }
  .tab.active .ico { transform: translateY(-1px) scale(1.12); }
  .tab.active::before { content: ""; position: absolute; top: 6px; left: 50%; width: 46px; height: 30px; margin-left: -23px; border-radius: 99px; background: var(--accent-soft); z-index: -1; }
  /* no fill mode: if a phone skips animations, the page simply shows as normal */
  .page.enter { animation: rise 0.3s ease-out; }
  @keyframes rise { from { opacity: 0.4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 420px) { .timer b { font-size: 28px; } }
  @media (prefers-reduced-motion: reduce) {
    #checkinNowBtn.pulse, .page.enter { animation: none; }
    button, a.btn, .tab .ico { transition: none; }
  }
  .hidden { display: none !important; }
  @media (max-width: 420px) { .timer b { font-size: 26px; } .card { padding: 16px; } .why-big { font-size: 21px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Break <span>Free</span></h1>
    <div class="greet" id="greet"></div>
  </header>

  <!-- LANGUAGE -->
  <section id="langScreen" class="hidden">
    <div class="card">
      <h2>Choose your language · בחירת שפה</h2>
      <p class="sub">You can change these later in your profile · אפשר לשנות אחר כך בפרופיל</p>
      <div class="lang-btns">
        <button data-lang="en" aria-pressed="false">English<small>Left to right</small></button>
        <button data-lang="he" aria-pressed="false">עברית<small>מימין לשמאל</small></button>
      </div>
      <h2 style="margin-top:22px">I am · אני</h2>
      <div class="lang-btns gender-btns">
        <button data-gender="m" aria-pressed="false">Male<small>זכר</small></button>
        <button data-gender="f" aria-pressed="false">Female<small>נקבה</small></button>
      </div>
      <div class="error" id="langErr" role="alert"></div>
      <div class="nav"><span></span><button class="primary" id="langNext">Continue · המשך</button></div>
    </div>
  </section>

  <!-- SETUP -->
  <section id="setup" class="hidden">
    <div class="card">
      <div class="progress"><div id="progBar"></div></div>
      <div class="step-label" id="stepLabel"></div>
      <div id="stepBody"></div>
      <div class="error" id="stepError" role="alert"></div>
      <div class="nav">
        <button id="backBtn"></button>
        <button id="nextBtn" class="primary"></button>
      </div>
    </div>
  </section>

  <!-- APP PAGES -->
  <section id="app" class="hidden">
    <div id="pHome" class="page"></div>
    <div id="pWhy" class="page hidden"></div>
    <div id="pLearn" class="page hidden"></div>
    <div id="pComm" class="page hidden"></div>
    <div id="pProfile" class="page hidden"></div>
  </section>

  <!-- PUBLIC SHARE PAGE -->
  <section id="shareView" class="hidden"></section>
</div>

<nav class="tabbar hidden" id="tabbar">
  <div class="tabbar-inner">

    <button class="tab" data-tab="pWhy"><span class="ico">💚</span><span data-t="tabWhy"></span></button>

    <button class="tab" data-tab="pComm"><span class="ico">👥</span><span data-t="tabCommunity"></span></button>

<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="i18n.js?v=2026.10.21-2"></script>
<script src="articles.js?v=2026.10.21-2" onerror="window.BF_ARTICLES = window.BF_ARTICLES || []"></script>
<script src="firebase-config.js?v=2026.10.21-2"></script>
<script>
(function () {
  "use strict";

  /* ================= constants ================= */
  var KEY = "breakFree.app.v1";
  var APP_VERSION = "2026.10.21-2"; /* bump when publishing; shown at the bottom of Profile */
  var FB_VER = "10.12.2";
  var EMO = {
    alcohol: "🍺", cigarettes: "🚬", weed: "🌿", drugs: "💉", pills: "💊", junkfood: "🍔", sweets: "🍬",
    energy: "⚡", coffee: "☕", porn: "🔞", nailbiting: "😬", betting: "🎰", tiktok: "🎵", reels: "📱", other: "✨"
  };
  var HABIT_META = {
    /* countable habits ask for a number; "how often" habits pick from FREQ */
    alcohol: { per: "week", costly: true }, cigarettes: { per: "day", costly: true }, weed: { choice: true, costly: true },
    drugs: { choice: true, costly: true }, pills: { per: "day", costly: true }, junkfood: { choice: true, costly: true },
    sweets: { choice: true, costly: true }, energy: { per: "day", costly: true }, coffee: { per: "day", costly: true },
    porn: { per: "day" }, nailbiting: { choice: true }, betting: { per: "week", money: true },
    tiktok: { per: "day" }, reels: { per: "day" }, other: { choice: true, costly: true }
  };
  /* how-often answers, as times per day (used to estimate what was avoided) */
  var FREQ_PER_DAY = [1 / 7, 3 / 7, 1, 2.5, 5];
  function freqPerDay(h) { return h.freqChoice === "" ? 0 : (FREQ_PER_DAY[+h.freqChoice] || 0); }
  var HABIT_ORDER = Object.keys(EMO);
  var GOAL_IDS = ["happiness", "discipline", "health", "money", "sleep", "time", "relationships", "confidence", "focus"];
  var BELIEF_IDS = ["yes", "think", "unsure", "scared"];
  var SHARE_IDS = ["person", "community", "self"];
  var MILESTONES = [
    { id: "24h", emo: "🌱", ms: 864e5 }, { id: "morning", emo: "🌅" }, { id: "sayno", emo: "🙅" },
    { id: "3d", emo: "🔥", ms: 3 * 864e5 }, { id: "1w", emo: "⭐", ms: 7 * 864e5 }, { id: "2w", emo: "🌟", ms: 14 * 864e5 },
    { id: "1m", emo: "🏅", ms: 30 * 864e5 }, { id: "3m", emo: "🏆", ms: 90 * 864e5 }, { id: "1y", emo: "👑", ms: 365 * 864e5 }
  ];
  var MOODS = ["😞", "😕", "😐", "🙂", "😄"];
  var FAV_CHOICES = ["24h", "morning", "sayno", "1w", "1m", "3m", "1y"];
  var CURRENCIES = ["₪", "$", "€", "£"];

  /* ================= state ================= */
  function blankState() {
    return {
      lang: null, gender: null, setupDone: false,
      name: "", age: "", about: "",
      habits: [], currency: "₪",
      goals: [], goalOther: "", improve: "", critical: 7, belief: null,
      share: null, shareName: "", milestone: null, milestoneOther: "",
      why: "", reminderTimes: ["20:00"],
      checkins: {}, journal: {}, lastPrompt: null,
      shareId: null, notify: false, fcmToken: null
    };
  }
  var S = load();
  var step = 0, whyWarned = false, currentTab = "pHome", openArticle = null, msIdx = 0;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var s = JSON.parse(raw), b = blankState(); migrate(s); s.currency = "₪"; for (var k in b) if (!(k in s)) s[k] = b[k]; return s; }
    } catch (e) {}
    return blankState();
  }
  function newHabit(key) {
    return { key: key, other: "", startDate: todayStr(), startTime: nowTimeStr(), amount: "", amount2: "", freqChoice: "", cost: "",
      streakStart: null, bestMs: 0, restarts: 0, saidNo: null, firstStart: null, slips: [] };
  }
  /* Older versions kept a single habit at the top level: move it into S.habits. */
  function migrate(s) {
    var OLD_KEYS = ["startDate", "startTime", "amount", "amount2", "freqChoice", "cost", "streakStart", "bestMs", "restarts", "saidNo"];
    if (s.habit && !Array.isArray(s.habits)) {
      var h = newHabit(s.habit);
      OLD_KEYS.forEach(function (k) { if (k in s) h[k] = s[k]; });
      h.other = s.habitOther || "";
      s.habits = [h];
    }
    ["habit", "habitOther"].concat(OLD_KEYS).forEach(function (k) { delete s[k]; });
    var OLD_PER = { weed: 1, drugs: 1 / 7, junkfood: 1 / 7, sweets: 1, other: 1 };
    (s.habits || []).forEach(function (h) {
      if (OLD_PER[h.key] && h.freqChoice === "" && h.amount !== "" && !isNaN(+h.amount)) {
        var perDay = +h.amount * OLD_PER[h.key], best = 0;
        [1 / 7, 3 / 7, 1, 2.5, 5].forEach(function (v, j) { if (Math.abs(v - perDay) < Math.abs([1 / 7, 3 / 7, 1, 2.5, 5][best] - perDay)) best = j; });
        h.freqChoice = String(best);
      }
    });
    if (!Array.isArray(s.reminderTimes)) s.reminderTimes = [s.reminderTime || "20:00"];
    if (!s.journal) s.journal = {};
    (s.habits || []).forEach(function (h) { if (!h.firstStart) h.firstStart = h.streakStart; if (!Array.isArray(h.slips)) h.slips = []; });
    delete s.reminderTime;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    scheduleSync();
  }

  /* ================= helpers ================= */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  /* Hebrew text marks gendered words as [[male|female]]; pick the form for this user. */
  var packCache = {};
  function genderize(v, fem) {
    if (typeof v === "string") return v.replace(/\[\[([^|\]]*)\|([^\]]*)\]\]/g, function (_, m, f) { return fem ? f : m; });
    if (Array.isArray(v)) return v.map(function (x) { return genderize(x, fem); });
    if (v && typeof v === "object") { var o = {}; for (var k in v) o[k] = genderize(v[k], fem); return o; }
    return v;
  }
  function L() {
    var lang = S.lang || "en", fem = S.gender === "f", key = lang + (fem ? "f" : "m");
    return packCache[key] || (packCache[key] = genderize(window.BF_I18N[lang], fem));
  }
  function t(key, vars) {
    var s = L().ui[key];
    if (s == null) s = window.BF_I18N.en.ui[key] || key;
    if (vars) for (var k in vars) s = s.split("{" + k + "}").join(vars[k]);
    return s;
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayStr() { return dateKey(new Date()); }
  function nowTimeStr() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function hab(key) { return L().habits[key] || L().habits.other; }
  function habitLabel(h) { return h.key === "other" ? (h.other || hab("other").label) : hab(h.key).label; }
  function habitNameOf(h) {
    if (h.key === "other") return h.other || hab("other").label;
    var x = hab(h.key);
    return x.short || (S.lang === "he" ? x.label : x.label.toLowerCase());
  }
  function habitNames() { return joinNice(S.habits.map(habitNameOf)); }
  function goalLabels() {
    var list = S.goals.map(function (id) { var g = L().goals[id]; return g ? (S.lang === "he" ? g.label : g.label.toLowerCase()) : id; });
    if (S.goalOther.trim()) list.push(S.goalOther.trim());
    return list;
  }
  function joinNice(list) {
    if (list.length <= 1) return list.join("");
    var and = L().plural.and;
    return list.slice(0, -1).join(", ") + and + list[list.length - 1];
  }
  function milestoneLabel(id) {
    if (id === "custom") return S.milestoneOther;
    return L().milestones[id] || "";
  }
  function streakMsOf(h) { return h.streakStart ? Date.now() - h.streakStart : 0; }
  function longestStreak() { return S.habits.reduce(function (m, h) { return Math.max(m, streakMsOf(h)); }, 0); }
  function fmtNum(n) { return n >= 100 ? Math.round(n).toLocaleString(L().locale) : (Math.round(n * 10) / 10).toLocaleString(L().locale); }
  function heldText(ms) {
    var d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, P = L().plural;
    if (d > 0) return P.day(d) + (h ? P.and + P.hour(h) : "");
    return P.hour(h);
  }
  function randomId(n) {
    var a = "abcdefghijkmnpqrstuvwxyz23456789", s = "", r = new Uint32Array(n);
    (window.crypto || window.msCrypto).getRandomValues(r);
    for (var i = 0; i < n; i++) s += a[r[i] % a.length];
    return s;
  }
  var toastTimer;
  function toast(msg) {
    var el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3000);
  }
  function confetti() {
    var colors = ["#2f8f6b", "#e0a526", "#5ccc9f", "#e46a8b", "#4f8fdc"];
    for (var i = 0; i < 60; i++) {
      var c = document.createElement("div");
      c.className = "confetti"; c.style.left = Math.random() * 100 + "vw"; c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.8 + Math.random() * 1.8) + "s"; c.style.animationDelay = (Math.random() * 0.4) + "s";
      document.body.appendChild(c);
      setTimeout(function (el) { el.remove(); }, 4200, c);
    }
  }
  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {} ta.remove(); done();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  function openModal(html) { $("modal").innerHTML = html; $("overlay").classList.add("show"); }
  function closeModal() { $("overlay").classList.remove("show"); }
  $("overlay").addEventListener("click", function (e) { if (e.target === $("overlay")) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  /* ================= language ================= */
  function applyLang() {
    var l = S.lang || "en";
    document.documentElement.lang = l;
    document.documentElement.dir = window.BF_I18N[l].dir;
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t(el.getAttribute("data-t")); });
  }
  /* first screen: language + male/female, then Continue */
  var pick = { lang: null, gender: null };
  function drawPicks() {
    document.querySelectorAll("[data-lang]").forEach(function (b) { var on = b.dataset.lang === pick.lang; b.classList.toggle("selected", on); b.setAttribute("aria-pressed", String(on)); });
    document.querySelectorAll("[data-gender]").forEach(function (b) { var on = b.dataset.gender === pick.gender; b.classList.toggle("selected", on); b.setAttribute("aria-pressed", String(on)); });
  }
  document.querySelectorAll("[data-lang]").forEach(function (b) { b.addEventListener("click", function () { pick.lang = b.dataset.lang; $("langErr").textContent = ""; drawPicks(); }); });
  document.querySelectorAll("[data-gender]").forEach(function (b) { b.addEventListener("click", function () { pick.gender = b.dataset.gender; $("langErr").textContent = ""; drawPicks(); }); });
  $("langNext").addEventListener("click", function () {
    if (!pick.lang || !pick.gender) { $("langErr").textContent = !pick.lang ? "Choose a language · בחרו שפה" : "Choose male or female · בחרו זכר או נקבה"; return; }
    S.lang = pick.lang; S.gender = pick.gender; save(); applyLang(); route();
  });

  /* ================= setup steps ================= */
  function currencySelect() {
    return "<select id='currency' aria-label='Currency'>" + CURRENCIES.map(function (c) {
      return "<option" + (S.currency === c ? " selected" : "") + ">" + c + "</option>";
    }).join("") + "</select>";
  }
  function critText(v) { var c = L().crit; return v <= 3 ? c[0] : v <= 6 ? c[1] : v <= 8 ? c[2] : c[3]; }

  var STEPS = [
    { // profile
      render: function () {
        return "<h2>" + t("profTitle") + "</h2><p class='sub'>" + t("profSub") + "</p>" +
          "<label class='field' for='pName'>" + t("name") + "</label><input type='text' id='pName' maxlength='40' autocomplete='given-name' placeholder='" + esc(t("namePh")) + "' value='" + esc(S.name) + "'>" +
          "<label class='field' for='pAge'>" + t("age") + "</label><input type='number' id='pAge' min='10' max='120' inputmode='numeric' placeholder='" + esc(t("agePh")) + "' value='" + esc(S.age) + "'>" +
          "<label class='field' for='pAbout'>" + t("about") + " <span class='muted'>" + t("optional") + "</span></label><textarea id='pAbout' maxlength='500' placeholder='" + esc(t("aboutPh")) + "'>" + esc(S.about) + "</textarea>";
      },
      bind: function () {
        $("pName").addEventListener("input", function () { S.name = this.value; });
        $("pAge").addEventListener("input", function () { S.age = this.value; });
        $("pAbout").addEventListener("input", function () { S.about = this.value; });
      },
      validate: function () {
        if (!S.name.trim()) return t("errName");
        var a = +S.age; if (!S.age || isNaN(a) || a < 10 || a > 120) return t("errAge");
      }
    },
    { // habits (one or more)
      render: function () {
        var html = "<h2>" + t("habitTitle") + "</h2><p class='sub'>" + t("habitSub") + "</p><div class='tiles'>";
        HABIT_ORDER.forEach(function (k) {
          var on = !!findHabit(k);
          html += "<button class='tile" + (on ? " selected" : "") + "' data-habit='" + k + "' aria-pressed='" + on + "'><span class='emo'>" + EMO[k] + "</span>" + esc(L().habits[k].label) + "</button>";
        });
        html += "</div>";
        var o = findHabit("other");
        if (o) html += "<label class='field' for='habitOther'>" + t("otherWhat") + "</label><input type='text' id='habitOther' maxlength='40' placeholder='" + esc(t("otherPh")) + "' value='" + esc(o.other) + "'>";
        return html;
      },
      bind: function () {
        document.querySelectorAll("[data-habit]").forEach(function (b) {
          b.addEventListener("click", function () {
            var k = b.dataset.habit, i = S.habits.map(function (h) { return h.key; }).indexOf(k);
            if (i >= 0) S.habits.splice(i, 1); else S.habits.push(newHabit(k));
            renderStep();
          });
        });
        var o = $("habitOther"); if (o) o.addEventListener("input", function () { findHabit("other").other = o.value; });
      },
      validate: function () {
        if (!S.habits.length) return t("errHabit");
        var o = findHabit("other");
        if (o && !o.other.trim()) return t("errOther");
      }
    },
    { // start date per habit
      render: function () {
        var multi = S.habits.length > 1;
        return "<h2>" + t("dateTitle") + "</h2><p class='sub'>" + t("dateSub") + "</p>" + S.habits.map(function (h, i) {
          return (multi ? "<h3 style='margin-top:16px'>" + EMO[h.key] + " " + esc(habitLabel(h)) + "</h3>" : "") +
            "<div class='row'><div><label class='field' for='sDate" + i + "'>" + t("startDate") + "</label><input type='date' id='sDate" + i + "' value='" + esc(h.startDate) + "'></div>" +
            "<div><label class='field' for='sTime" + i + "'>" + t("startTime") + "</label><input type='time' id='sTime" + i + "' value='" + esc(h.startTime) + "'></div></div>";
        }).join("") + "<p class='small muted'>" + t("dateTip") + "</p>";
      },
      bind: function () {
        S.habits.forEach(function (h, i) {
          ["input", "change"].forEach(function (ev) {
            $("sDate" + i).addEventListener(ev, function () { h.startDate = this.value; });
            $("sTime" + i).addEventListener(ev, function () { h.startTime = this.value; });
          });
        });
      },
      validate: function () {
        for (var i = 0; i < S.habits.length; i++) {
          if (!S.habits[i].startDate) return t("errDate");
          if (!S.habits[i].startTime) S.habits[i].startTime = "00:00";
        }
      }
    },
    { // amount per habit
      render: function () {
        var multi = S.habits.length > 1, needCur = false;
        var html = "<h2>" + t("amtTitle") + "</h2><p class='sub'>" + t("amtSub") + "</p>";
        S.habits.forEach(function (h, i) {
          var x = hab(h.key), m = HABIT_META[h.key] || {};
          var q = h.key === "other" ? x.q.replace("?", " (" + h.other + ")?") : x.q;
          if (multi) html += "<h3 style='margin-top:18px'>" + EMO[h.key] + " " + esc(habitLabel(h)) + "</h3>";
          if (m.choice) {
            html += "<label class='field'>" + esc(q) + "</label><div class='opts'>" + L().freq.map(function (c, j) {
              return "<button class='opt" + (h.freqChoice === String(j) ? " selected" : "") + "' data-freq='" + i + ":" + j + "'>" + esc(c) + "</button>";
            }).join("") + "</div>";
          } else if (m.money) {
            needCur = true;
            html += "<label class='field' for='amt" + i + "'>" + esc(q) + " (" + S.currency + ")</label><input type='number' id='amt" + i + "' min='0' step='any' inputmode='decimal' value='" + esc(h.amount) + "' placeholder='200'>";
            html += "<label class='field' for='amtb" + i + "'>" + esc(x.second) + "</label><input type='number' id='amtb" + i + "' min='0' step='any' inputmode='decimal' value='" + esc(h.amount2) + "' placeholder='5'>";
          } else {
            html += "<label class='field' for='amt" + i + "'>" + esc(q) + "</label><input type='number' id='amt" + i + "' min='0' step='any' inputmode='decimal' value='" + esc(h.amount) + "' placeholder='10'>";
          }
          if (m.costly) {
            needCur = true;
            html += "<label class='field' for='cost" + i + "'>" + t("costQ") + " <span class='muted'>" + t("optional") + "</span></label>" +
              "<input type='number' id='cost" + i + "' min='0' step='any' inputmode='decimal' value='" + esc(h.cost) + "' placeholder='50'>";
          }
        });
        return html;
      },
      bind: function () {
        document.querySelectorAll("[data-freq]").forEach(function (b) {
          b.addEventListener("click", function () { var p = b.dataset.freq.split(":"); S.habits[+p[0]].freqChoice = p[1]; renderStep(); });
        });
        S.habits.forEach(function (h, i) {
          [["amt", "amount"], ["amtb", "amount2"], ["cost", "cost"]].forEach(function (p) {
            var el = $(p[0] + i); if (el) el.addEventListener("input", function () { h[p[1]] = el.value; });
          });
        });
        var cur = $("currency"); if (cur) cur.addEventListener("change", function () { S.currency = cur.value; renderStep(); });
      },
      validate: function () {
        for (var i = 0; i < S.habits.length; i++) {
          var h = S.habits[i], m = HABIT_META[h.key] || {}, pre = S.habits.length > 1 ? habitLabel(h) + ": " : "";
          if (m.choice) { if (h.freqChoice === "") return pre + t("errChoice"); continue; }
          if (h.amount === "" || isNaN(+h.amount) || +h.amount < 0) return pre + t("errNum");
          if (m.money && (h.amount2 === "" || isNaN(+h.amount2) || +h.amount2 < 0)) return pre + t("errBets");
        }
      }
    },
    { // goals
      render: function () {
        var html = "<h2>" + t("goalsTitle") + "</h2><p class='sub'>" + t("goalsSub") + "</p><div class='chips'>";
        GOAL_IDS.forEach(function (id) {
          html += "<button class='chip" + (S.goals.indexOf(id) >= 0 ? " selected" : "") + "' data-goal='" + id + "' aria-pressed='" + (S.goals.indexOf(id) >= 0) + "'>" + esc(L().goals[id].label) + "</button>";
        });
        html += "</div><label class='field' for='goalOther'>" + t("goalOther") + " <span class='muted'>" + t("optional") + "</span></label><input type='text' id='goalOther' maxlength='40' placeholder='" + esc(t("goalOtherPh")) + "' value='" + esc(S.goalOther) + "'>";
        return html;
      },
      bind: function () {
        document.querySelectorAll("[data-goal]").forEach(function (b) {
          b.addEventListener("click", function () {
            var i = S.goals.indexOf(b.dataset.goal);
            if (i >= 0) S.goals.splice(i, 1); else S.goals.push(b.dataset.goal);
            b.classList.toggle("selected"); b.setAttribute("aria-pressed", String(i < 0));
          });
        });
        $("goalOther").addEventListener("input", function () { S.goalOther = this.value; });
      },
      validate: function () { if (!S.goals.length && !S.goalOther.trim()) return t("errGoal"); }
    },
    { // improve
      render: function () {
        return "<h2>" + t("improveTitle") + "</h2><p class='sub'>" + esc(t("improveSub")) + "</p><textarea id='improve' maxlength='300' placeholder='" + esc(t("improvePh")) + "'>" + esc(S.improve) + "</textarea>";
      },
      bind: function () { $("improve").addEventListener("input", function () { S.improve = this.value; }); },
      validate: function () { if (!S.improve.trim()) return t("errImprove"); }
    },
    { // critical
      render: function () {
        return "<h2>" + t("critTitle") + "</h2><p class='sub'>" + t("critSub") + "</p><div class='range-val' id='critVal'>" + S.critical + "</div>" +
          "<input type='range' id='crit' min='1' max='10' value='" + S.critical + "' aria-label='" + esc(t("critTitle")) + "'><div class='range-text' id='critText'>" + critText(S.critical) + "</div>";
      },
      bind: function () {
        $("crit").addEventListener("input", function () { S.critical = +this.value; $("critVal").textContent = S.critical; $("critText").textContent = critText(S.critical); });
      },
      validate: function () {}
    },
    { // belief

  /* ---------- streak chart: the streak's length at the end of each of the last 30 days ---------- */

      list.forEach(function (x, i) {
        var a = Math.max(0, Date.now() - x.streakStart);
        $("svD" + i).textContent = Math.floor(a / 864e5); $("svH" + i).textContent = Math.floor(a / 36e5) % 24;
        $("svM" + i).textContent = Math.floor(a / 6e4) % 60; $("svS" + i).textContent = Math.floor(a / 1e3) % 60;
      });
    }
    upd(); shareTimer = setInterval(upd, 1000);
  }
  window.BF_demoShare = drawShareView; /* for testing */

  /* ================= loop + start ================= */
  setInterval(function () {
    if (!S.setupDone || $("app").classList.contains("hidden")) return;
    if (currentTab === "pHome") {
      tick();
      var now = new Date();
      if (now.getSeconds() === 0) { renderStats(); renderBadges(); }
    }
    if (new Date().getSeconds() % 15 === 0) checkReminder();
  }, 1000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && S.setupDone && !$("app").classList.contains("hidden")) { showTab(currentTab); scheduleSync(); }
  });
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("firebase-messaging-sw.js").catch(function () {});
  initFirebase();
  route();
})();
</script>
</body>
